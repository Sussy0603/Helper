<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café des Formules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. THEME — colors live here. Change these, the whole app follows.
   ============================================================ */
:root{
  --bg:#FBF4EA; --surface:#FFFDF9; --surface-2:#F5EADB; --line:#E8D8C4;
  --ink:#3B2A20; --muted:#7A6353;
  --accent:#C8633A; --accent-soft:#F7DCCB; --accent-ink:#FFFFFF;
  --ok:#3F7F4E; --ok-soft:#DCEFD9; --bad:#B43E32; --bad-soft:#F8DAD5;
  --shadow:0 2px 0 rgba(59,42,32,.08), 0 8px 24px rgba(59,42,32,.06);
  --radius:16px;
  --font-head:"Fredoka", "Trebuchet MS", sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1E1712; --surface:#2A211A; --surface-2:#33281F; --line:#46382C;
    --ink:#F6EADC; --muted:#C2AA94;
    --accent:#E8895C; --accent-soft:#4A2E20; --accent-ink:#1E1712;
    --ok:#7CC08A; --ok-soft:#23382A; --bad:#EE8577; --bad-soft:#452622;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--font-mono)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}

/* ============================================================
   2. HEADER + TABS
   ============================================================ */
header{display:flex;align-items:center;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:1.5rem}
.brand small{display:block;color:var(--muted);font-size:.85rem;font-family:var(--font-body)}
nav{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:999px}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted)}
nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ============================================================
   3. SHARED PIECES
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.btn{border:2px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:12px 22px;font-size:1.05rem}
.btn-main:hover{filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}

/* ============================================================
   4. HOME — topic picker
   ============================================================ */
.hero{display:flex;gap:18px;align-items:center;margin:14px 0 22px;flex-wrap:wrap}
.hero .card{flex:1;min-width:260px;display:flex;gap:16px;align-items:center}
.hero h2{font-size:1.6rem;margin-bottom:4px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.topic{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.topic:hover{transform:translateY(-2px);border-color:var(--accent)}
.topic h3{font-size:1.2rem}
.topic .pill{align-self:flex-start}
.topic .row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}

/* ============================================================
   5. PRACTICE screen
   ============================================================ */
.topbar{display:flex;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.topbar .count{margin-left:auto}
.task h2{font-size:1.35rem;margin-bottom:6px}
.task p{margin:0 0 4px}
.task b{color:var(--accent)}
.sheet-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sheet{border-collapse:collapse;font-size:.95rem;min-width:100%}
.sheet th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.8rem;padding:4px 8px;border:1px solid var(--line);position:sticky;top:0}
.sheet th.rh{min-width:34px;text-align:center}
.sheet td{border:1px solid var(--line);padding:6px 10px;min-width:92px;white-space:nowrap;cursor:pointer;height:36px}
.sheet td:hover{background:var(--surface-2)}
.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.fillc{background:var(--accent-soft)}
.sheet td.target{outline:3px solid var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.sheet td.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.sheet td.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.sheet tr:first-child td{font-weight:700}
.fx{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.fx:focus-within{border-color:var(--accent)}
.fx label{display:flex;align-items:center;padding:0 12px;background:var(--surface-2);font-family:var(--font-mono);font-weight:700;color:var(--muted);font-style:italic}
.fx input{flex:1;border:0;background:transparent;color:var(--ink);font-family:var(--font-mono);font-size:1.1rem;padding:12px;min-width:0;outline:none}
.tip{font-size:.85rem;color:var(--muted);margin:6px 2px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.feedback{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback .msg{flex:1}
.feedback .msg strong{font-family:var(--font-head);font-size:1.15rem;display:block;margin-bottom:2px}
.feedback code,.task code,.cheat code{font-family:var(--font-mono);background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.92em;border:1px solid var(--line)}
.options{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);padding:14px 16px;border-radius:12px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.cat svg{display:block}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.hop{animation:hop .5s ease}

/* ============================================================
   6. PROGRESS + CHEAT SHEET
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 20px}
.stat{padding:16px}
.stat b{display:block;font-family:var(--font-head);font-size:2rem;line-height:1.1}
.prog-row{display:grid;grid-template-columns:1fr 2fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prog-row:last-child{border-bottom:0}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;margin:12px 0 18px}
.search:focus{border-color:var(--accent);outline:none}
.cheat h3{font-size:1.2rem;margin:22px 0 10px}
.fn{padding:14px 16px;margin-bottom:10px}
.fn .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fn .name{font-family:var(--font-mono);font-weight:700;font-size:1.05rem;color:var(--accent)}
.fn .syn{font-family:var(--font-mono);font-size:.9rem;margin:6px 0 4px;overflow-wrap:anywhere}
.fn p{margin:2px 0}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

@media (max-width:600px){
  header{padding-top:12px}
  nav{width:100%;justify-content:space-between}
  nav button{padding:8px 10px;font-size:.88rem}
  .actions .btn-main{width:100%}
  .prog-row{grid-template-columns:1fr auto}
  .prog-row .bar{grid-column:1 / -1;order:3}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="cat" id="logo"></span>
      <div><h1>Café des Formules</h1><small>Excel practice · 420-2D4</small></div>
    </div>
    <nav aria-label="Main">
      <button data-go="home">Practice</button>
      <button data-go="progress">Progress</button>
      <button data-go="cheat">Cheat sheet</button>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* ==================================================================
   PART A — THE MINI EXCEL ENGINE
   Reads a formula like =SI(B2>=60;"Réussi";"Échec") and computes it.
   Steps: tokenize (cut into pieces) -> parse (build a tree) -> evaluate.
   ================================================================== */

class XErr { constructor(code, msg){ this.code = code; this.msg = msg; } }
const fail = (code, msg) => { throw new XErr(code, msg); };

const stripAcc = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
function colToNum(s){ let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
function numToCol(n){ let s = ''; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function parseAddr(a){ const m = /^([A-Z]+)(\d+)$/.exec(a); return { c: colToNum(m[1]), r: +m[2] }; }
function parseNumFr(s){ const t = String(s).trim(); return /^-?\d+(?:[.,]\d+)?$/.test(t) ? parseFloat(t.replace(',', '.')) : null; }

// English names -> French names, so we can give a friendly hint.
const EN_FR = { SUM:'SOMME', AVERAGE:'MOYENNE', COUNT:'NB', COUNTA:'NBVAL', IF:'SI', AND:'ET', OR:'OU', NOT:'NON',
  XLOOKUP:'RECHERCHEX', VLOOKUP:'RECHERCHEV', SUMIF:'SOMME.SI', COUNTIF:'NB.SI', AVERAGEIF:'MOYENNE.SI',
  SUMIFS:'SOMME.SI.ENS', COUNTIFS:'NB.SI.ENS', TODAY:'AUJOURDHUI', NOW:'MAINTENANT', DAY:'JOUR', MONTH:'MOIS',
  YEAR:'ANNEE', WEEKDAY:'JOURSEM', TEXT:'TEXTE', LEFT:'GAUCHE', RIGHT:'DROITE', MID:'STXT', LEN:'NBCAR',
  FIND:'TROUVE', SEARCH:'CHERCHE', UPPER:'MAJUSCULE', LOWER:'MINUSCULE', PROPER:'NOMPROPRE', TRIM:'SUPPRESPACE',
  RAND:'ALEA', RANDBETWEEN:'ALEA.ENTRE.BORNES', INT:'ENT', ROUND:'ARRONDI', ROUNDUP:'ARRONDI.SUP',
  ROUNDDOWN:'ARRONDI.INF', IFERROR:'SIERREUR', CONCATENATE:'CONCATENER', TRUE:'VRAI', FALSE:'FAUX' };

// --- 1. Tokenize: cut the text into pieces (numbers, cells, functions...) ---
function tokenize(src){
  const t = []; let i = 0;
  while (i < src.length){
    const c = src[i], rest = src.slice(i); let m;
    if (/\s/.test(c)){ i++; continue; }
    if (c === '"'){
      let j = i + 1, s = '';
      for (;;){
        if (j >= src.length) fail('PARSE', 'A quote <code>"</code> is opened but never closed.');
        if (src[j] === '"'){ if (src[j + 1] === '"'){ s += '"'; j += 2; continue; } break; }
        s += src[j++];
      }
      t.push({ k:'str', v:s }); i = j + 1; continue;
    }
    if ((m = /^\d+(?:[.,]\d+)?/.exec(rest))){ t.push({ k:'num', v:parseFloat(m[0].replace(',', '.')) }); i += m[0].length; continue; }
    if ((m = /^(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_.(])/.exec(rest))){
      t.push({ k:'ref', c:colToNum(m[2]), r:+m[4], ac:!!m[1], ar:!!m[3] }); i += m[0].length; continue;
    }
    if ((m = /^[A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ0-9_.]*/.exec(rest))){
      const name = stripAcc(m[0]).toUpperCase(); i += m[0].length;
      let j = i; while (src[j] === ' ') j++;
      if (src[j] === '('){ t.push({ k:'fn', v:name, raw:m[0] }); i = j; continue; }
      if (name === 'VRAI' || name === 'FAUX'){ t.push({ k:'bool', v:name === 'VRAI' }); continue; }
      if (EN_FR[name]) fail('#NOM?', `<code>${m[0]}</code> is English. In French Excel, write <code>${EN_FR[name]}</code>.`);
      fail('#NOM?', `Excel doesn't know <code>${m[0]}</code>. If it's text, put it between quotes: <code>"${m[0]}"</code>.`);
    }
    const two = rest.slice(0, 2);
    if (['<=', '>=', '<>'].includes(two)){ t.push({ k:'op', v:two }); i += 2; continue; }
    if ('+-*/^&=<>%'.includes(c)){ t.push({ k:'op', v:c }); i++; continue; }
    if ('();:'.includes(c)){ t.push({ k:c }); i++; continue; }
    if (c === ',') fail('PARSE', 'In French Excel, you separate arguments with <code>;</code> (semicolon), not a comma.');
    fail('PARSE', `I don't understand the character <code>${c}</code>.`);
  }
  return t;
}

// --- 2. Parse: build a tree, following Excel's order of operations ---
function parse(formula){
  const s = String(formula).trim();
  if (!s.startsWith('=')) fail('PARSE', 'A formula always starts with <code>=</code>.');
  if (s.length === 1) fail('PARSE', 'Your formula is empty. Type something after the <code>=</code>.');
  const toks = tokenize(s.slice(1)); let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const isOp = list => peek() && peek().k === 'op' && list.includes(peek().v);
  const bin = (sub, ops) => () => { let l = sub(); while (isOp(ops)){ const op = next().v; l = { t:'bin', op, l, r:sub() }; } return l; };
  const primary = () => {
    const tk = next();
    if (!tk) fail('PARSE', 'The formula stops too early. Something is missing at the end.');
    if (tk.k === 'num') return { t:'num', v:tk.v };
    if (tk.k === 'str') return { t:'str', v:tk.v };
    if (tk.k === 'bool') return { t:'bool', v:tk.v };
    if (tk.k === 'ref'){
      if (peek() && peek().k === ':'){ next(); const b = next();
        if (!b || b.k !== 'ref') fail('PARSE', 'After <code>:</code> you need another cell, like <code>A1:A5</code>.');
        return { t:'range', a:tk, b }; }
      return { t:'ref', ...tk };
    }
    if (tk.k === '('){ const e = cmp(); if (!peek() || peek().k !== ')') fail('PARSE', 'A parenthesis <code>(</code> is not closed.'); next(); return e; }
    if (tk.k === 'fn'){
      next(); const args = [];
      if (peek() && peek().k === ')'){ next(); return { t:'fn', name:tk.v, raw:tk.raw, args }; }
      for (;;){
        if (peek() && (peek().k === ';' || peek().k === ')')) args.push({ t:'empty' }); else args.push(cmp());
        const n = next();
        if (!n) fail('PARSE', `The parenthesis of <code>${tk.raw}(</code> is never closed.`);
        if (n.k === ')') break;
        if (n.k !== ';') fail('PARSE', `Something is off inside <code>${tk.raw}( )</code>. Check your <code>;</code> separators.`);
      }
      return { t:'fn', name:tk.v, raw:tk.raw, args };
    }
    if (tk.k === ')') fail('PARSE', 'There is a <code>)</code> where a value should be.');
    if (tk.k === ';') fail('PARSE', 'There is a <code>;</code> outside of a function.');
    fail('PARSE', `Unexpected <code>${tk.v || tk.k}</code>.`);
  };
  const postfix = () => { let e = primary(); while (isOp(['%'])){ next(); e = { t:'pct', e }; } return e; };
  const unary = () => { if (isOp(['-'])){ next(); return { t:'neg', e:unary() }; } if (isOp(['+'])){ next(); return unary(); } return postfix(); };
  const pow = bin(unary, ['^']), mul = bin(pow, ['*', '/']), add = bin(mul, ['+', '-']), cat = bin(add, ['&']);
  const cmp = bin(cat, ['=', '<>', '<', '>', '<=', '>=']);
  const ast = cmp();
  if (p < toks.length){
    if (toks[p].k === ')') fail('PARSE', 'There is one closing parenthesis <code>)</code> too many.');
    fail('PARSE', 'There is something extra at the end. A missing operator or <code>;</code>?');
  }
  return ast;
}

// --- 3. Evaluate: compute the value ---
const isRange = v => v && v.range === true;
function scal(v){ if (isRange(v)){ if (v.vals.length === 1) return v.vals[0]; fail('#VALEUR!', 'This gives a whole range, not one value. Wrap it in a function like <code>SOMME( )</code>.'); } return v; }
function num(v){
  v = scal(v);
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  const n = parseNumFr(v); if (n !== null) return n;
  fail('#VALEUR!', `<code>"${v}"</code> is text, so Excel can't do math with it.`);
}
function fmtPlain(n){ if (!isFinite(n)) return String(n); const r = Number(n.toPrecision(12)); return String(r).replace('.', ','); }
function txt(v){ v = scal(v); if (v === null || v === undefined) return ''; if (typeof v === 'number') return fmtPlain(v); if (typeof v === 'boolean') return v ? 'VRAI' : 'FAUX'; return String(v); }
function bool(v){ v = scal(v); if (v === null) return false; if (typeof v === 'boolean') return v; if (typeof v === 'number') return v !== 0;
  const u = String(v).toUpperCase(); if (u === 'VRAI') return true; if (u === 'FAUX') return false;
  fail('#VALEUR!', `<code>"${v}"</code> is text, not a VRAI/FAUX test. Did you forget a comparison like <code>&gt;=</code>?`); }
function rank(v){ return typeof v === 'number' ? 0 : typeof v === 'string' ? 1 : 2; }
function compare(op, a, b){
  a = scal(a); b = scal(b);
  if (a === null) a = typeof b === 'string' ? '' : typeof b === 'boolean' ? false : 0;
  if (b === null) b = typeof a === 'string' ? '' : typeof a === 'boolean' ? false : 0;
  let d;
  if (rank(a) !== rank(b)) d = rank(a) - rank(b);
  else if (typeof a === 'string') { const x = a.toLowerCase(), y = b.toLowerCase(); d = x < y ? -1 : x > y ? 1 : 0; }
  else d = Number(a) - Number(b);
  if (Math.abs(d) < 1e-12) d = 0;
  return { '=':d === 0, '<>':d !== 0, '<':d < 0, '>':d > 0, '<=':d <= 0, '>=':d >= 0 }[op];
}
function pos(n, ctx){ return { c: n.c + (n.ac ? 0 : ctx.dc), r: n.r + (n.ar ? 0 : ctx.dr) }; }
function cellAt(ctx, c, r){
  if (c < 1 || r < 1) fail('#REF!', 'That reference slides off the edge of the sheet when copied. Should it be locked with <code>$</code>?');
  if (ctx.self && ctx.self.c === c && ctx.self.r === r) fail('#REF!', 'Circular reference: your formula uses its own cell.');
  const v = ctx.cells[numToCol(c) + r]; return v === undefined ? null : v;
}
function ev(n, ctx){
  switch (n.t){
    case 'num': case 'str': case 'bool': return n.v;
    case 'empty': return null;
    case 'ref': { const q = pos(n, ctx); return cellAt(ctx, q.c, q.r); }
    case 'range': {
      const a = pos(n.a, ctx), b = pos(n.b, ctx);
      const c1 = Math.min(a.c, b.c), c2 = Math.max(a.c, b.c), r1 = Math.min(a.r, b.r), r2 = Math.max(a.r, b.r);
      const vals = []; for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) vals.push(cellAt(ctx, c, r));
      return { range:true, rows:r2 - r1 + 1, cols:c2 - c1 + 1, vals };
    }
    case 'neg': return -num(ev(n.e, ctx));
    case 'pct': return num(ev(n.e, ctx)) / 100;
    case 'bin': {
      const l = ev(n.l, ctx), r = ev(n.r, ctx);
      if (n.op === '&') return txt(l) + txt(r);
      if (['=', '<>', '<', '>', '<=', '>='].includes(n.op)) return compare(n.op, l, r);
      const x = num(l), y = num(r);
      if (n.op === '+') return x + y; if (n.op === '-') return x - y; if (n.op === '*') return x * y;
      if (n.op === '/'){ if (y === 0) fail('#DIV/0!', 'Division by zero. The cell you divide by is empty or 0.'); return x / y; }
      if (n.op === '^') return Math.pow(x, y);
    }
    case 'fn': {
      const f = FN[n.name];
      if (!f){
        if (EN_FR[n.name]) fail('#NOM?', `<code>${n.raw}</code> is the English name. In French Excel, write <code>${EN_FR[n.name]}</code>.`);
        fail('#NOM?', `Excel doesn't know the function <code>${n.raw}</code>. Check the spelling (and the dots, like <code>NB.SI</code>).`);
      }
      const A = i => (n.args[i] && n.args[i].t !== 'empty') ? ev(n.args[i], ctx) : null;
      const has = i => n.args[i] && n.args[i].t !== 'empty';
      if (f.min !== undefined && n.args.filter(a => a.t !== 'empty').length < f.min)
        fail('#VALEUR!', `<code>${n.raw}</code> needs more arguments. Syntax: <code>${f.syn}</code>`);

// --- Helpers for functions ---
function numsOf(args, ctx){
  const out = [];
  for (const a of args){
    if (a.t === 'empty') continue;
    const v = ev(a, ctx);
    if (isRange(v) || a.t === 'ref'){ const arr = isRange(v) ? v.vals : [v]; for (const x of arr) if (typeof x === 'number') out.push(x); }
    else out.push(num(v));
  }
  return out;
}
function needRange(v, fname){ if (!isRange(v)) fail('#VALEUR!', `In <code>${fname}</code>, this argument must be a range like <code>A2:A10</code>.`); return v; }
function makeCrit(c){
  c = scal(c);
  if (typeof c === 'number') return x => (typeof x === 'number' && Math.abs(x - c) < 1e-9) || (typeof x === 'string' && parseNumFr(x) === c);
  if (typeof c === 'boolean') return x => x === c;
  const s = c === null ? '' : String(c);
  const m = /^(<=|>=|<>|<|>|=)?([\s\S]*)$/.exec(s); const op = m[1] || '=', val = m[2];
  const n = parseNumFr(val);
  if (val !== '' && n !== null) return x => typeof x === 'number' ? compare(op, x, n) : op === '<>';
  if (val === '') return op === '<>' ? x => x !== null && x !== '' : x => x === null || x === '';
  if (op === '=' || op === '<>'){
    const re = new RegExp('^' + val.toLowerCase().replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
    const hit = x => x !== null && re.test(String(x).toLowerCase());
    return op === '=' ? hit : x => !hit(x);
  }
  return x => typeof x === 'string' && compare(op, x, val);
}
function roundHalf(n, d, mode){
  const f = Math.pow(10, d), a = Number((Math.abs(n) * f).toPrecision(15));
  const r = mode === 'up' ? Math.ceil(a) : mode === 'down' ? Math.floor(a) : Math.round(a);
  return Number((Math.sign(n) * r / f).toPrecision(15));
}
// Excel dates = number of days since 30 Dec 1899
const DAY = 86400000, EPOCH = Date.UTC(1899, 11, 30);
const toSerial = (y, m, d) => (Date.UTC(y, m - 1, d) - EPOCH) / DAY;
const fromSerial = s => new Date(EPOCH + Math.floor(s) * DAY);
const DAYS_FR = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MONTHS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const pad = (n, w = 2) => String(n).padStart(w, '0');
function textFormat(v, f){
  const F = String(f).toLowerCase();
  if (/[jmad]/.test(F)){
    const dt = fromSerial(num(v));
    return F.replace(/jjjj|jjj|jj|j|mmmm|mmm|mm|m|aaaa|aa/g, t => ({
      jjjj: DAYS_FR[dt.getUTCDay()], jjj: DAYS_FR[dt.getUTCDay()].slice(0, 3) + '.', jj: pad(dt.getUTCDate()), j: dt.getUTCDate(),
      mmmm: MONTHS_FR[dt.getUTCMonth()], mmm: MONTHS_FR[dt.getUTCMonth()].slice(0, 4) + '.', mm: pad(dt.getUTCMonth() + 1), m: dt.getUTCMonth() + 1,
      aaaa: dt.getUTCFullYear(), aa: pad(dt.getUTCFullYear() % 100) }[t]));
  }
  let n = num(v); const pct = F.includes('%'); if (pct) n *= 100;
  const dec = (F.split(/[,.]/)[1] || '').replace(/[^0#]/g, '').length;
  let [i, d] = Math.abs(roundHalf(n, dec)).toFixed(dec).split('.');
  if (/[#0] [#0]/.test(F)) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '-' : '') + i + (d ? ',' + d : '') + (pct ? ' %' : '') + (F.includes('$') ? ' $' : '');
}

function collect(ast, out = { fns:new Set(), refs:0 }){
  if (!ast || typeof ast !== 'object') return out;
  if (ast.t === 'fn') out.fns.add(ast.name);
  if (ast.t === 'ref' || ast.t === 'range') out.refs++;
  for (const k of ['l', 'r', 'e']) if (ast[k]) collect(ast[k], out);
  if (ast.args) ast.args.forEach(a => collect(a, out));
  return out;
}

// --- Build a sheet from a grid ---
function buildSheet(ex){
  const cells = {}, fmt = {};
  (ex.grid || []).forEach((row, ri) => (row || []).forEach((v, ci) => {
    const a = numToCol(ci + 1) + (ri + 1);
    if (v === '' || v === null || v === undefined) return;
    if (typeof v === 'object' && 'date' in v){ cells[a] = v.date; fmt[a] = 'date'; } else cells[a] = v;
  }));
  const targets = [];
  if (ex.fill){ const [a, b] = ex.fill.split(':').map(parseAddr); for (let r = a.r; r <= b.r; r++) targets.push({ c:a.c, r }); }
  else if (ex.target) targets.push(parseAddr(ex.target));
  const fmtOf = addr => { if (fmt[addr]) return fmt[addr]; const f = ex.fmts || {}; if (f[addr]) return f[addr]; const col = addr.replace(/\d+/, ''); return f[col] || null; };
  return { cells, targets, fmtOf };
}
function display(v, f){
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'boolean') return v ? 'VRAI' : 'FAUX';
  if (typeof v === 'string') return v;
  if (f === 'date'){ const d = fromSerial(v); return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
  if (f === '$') return v.toLocaleString('fr-CA', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' $';
  if (f === 'pct') return (v * 100).toLocaleString('fr-CA', { maximumFractionDigits:2 }) + ' %';
  return v.toLocaleString('fr-CA', { maximumFractionDigits:6, useGrouping:false });
}
function same(a, b){
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b));
  if (typeof a === 'string' && typeof b === 'string') return stripAcc(a.trim()).toLowerCase() === stripAcc(b.trim()).toLowerCase();
  return a === b;
}

// --- Check a typed formula against the exercise ---
function runExercise(ex, formula){
  const sh = buildSheet(ex);
  let ast;
  try { ast = parse(formula); } catch (e){ return { parseError:e.msg || String(e), code:e.code }; }
  const refAst = parse(ex.sol);
  const first = sh.targets[0];
  const results = sh.targets.map(t => {
    const ctx = { cells:sh.cells, dr:t.r - first.r, dc:t.c - first.c, self:t };
    const addr = numToCol(t.c) + t.r;
    let got, err = null, exp;
    try { got = evaluate(ast, ctx); } catch (e){ if (!(e instanceof XErr)) throw e; err = e; }
    if (ex.check){
      let ok = !err;
      if (ok) for (let i = 0; i < 40 && ok; i++){ try { ok = ex.check(evaluate(ast, ctx)); } catch (e){ ok = false; } }
      return { addr, got, err, exp:null, ok };
    }
    exp = evaluate(refAst, ctx);
    return { addr, got, err, exp, ok:!err && same(got, exp) };
  });
  const info = collect(ast);
  const missing = (ex.mustUse || []).filter(f => !info.fns.has(f));
  const allOk = results.every(r => r.ok);
  return { results, missing, noRefs:!ex.noRef && info.refs === 0, allOk, pass:allOk && !missing.length && (ex.noRef || info.refs > 0), sh };
}

function sheetHTML(ex, res){
  const sh = buildSheet(ex);
  const tset = new Set(sh.targets.map(t => numToCol(t.c) + t.r));
  const firstT = sh.targets[0] ? numToCol(sh.targets[0].c) + sh.targets[0].r : null;
  let maxC = 1, maxR = ex.grid.length;
  ex.grid.forEach(r => { maxC = Math.max(maxC, (r || []).length); });
  sh.targets.forEach(t => { maxC = Math.max(maxC, t.c); maxR = Math.max(maxR, t.r); });
  const byAddr = {}; if (res && res.results) res.results.forEach(r => byAddr[r.addr] = r);
  let h = '<table class="sheet"><thead><tr><th class="rh"></th>';
  for (let c = 1; c <= maxC; c++) h += `<th>${numToCol(c)}</th>`;
  h += '</tr></thead><tbody>';
  for (let r = 1; r <= maxR; r++){
    h += `<tr><th class="rh">${r}</th>`;
    for (let c = 1; c <= maxC; c++){
      const a = numToCol(c) + r; let v = sh.cells[a], cls = [], content;
      if (tset.has(a)){
        cls.push(a === firstT ? 'target' : 'fillc');
        const rr = byAddr[a];
        if (rr){ cls = [rr.ok ? 'ok' : 'bad']; content = rr.err ? rr.err.code : display(rr.got, sh.fmtOf(a)); if (typeof rr.got === 'number' && !rr.err) cls.push('num'); }
        else content = a === firstT ? '?' : '';
      } else { content = display(v, sh.fmtOf(a)); if (typeof v === 'number') cls.push('num'); }
      h += `<td class="${cls.join(' ')}" data-addr="${a}" title="${a}">${esc(content)}</td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

function feedbackHTML(ex, res){
  if (!res) return '';
  if (res.parseError) return fb('sad', res.code && res.code !== 'PARSE' ? res.code : 'Formula problem', res.parseError);
  if (res.pass) return fb('happy', pick(['Purrfect!', 'Miaou! Nailed it.', 'The café cat approves.', 'Clean formula. Chef\'s kiss.', 'Exam-ready.']),
    (ex.fill ? `All ${res.results.length} copied cells are right. ` : '') + `Model answer: <code>${esc(ex.sol)}</code>`, 'ok');
  if (res.allOk && res.missing.length) return fb('think', 'Right answer, wrong tool', `This exercise wants you to use <code>${res.missing.join('</code>, <code>')}</code>.`);
  if (res.allOk && res.noRefs) return fb('think', 'Typed by hand?', 'The result is right, but use cell references (like <code>B2</code>) so it updates when the data changes.');
  const bad = res.results.find(r => !r.ok), firstOk = res.results[0].ok;
  if (bad.err) return fb('sad', bad.err.code + ' in ' + bad.addr, bad.err.msg + (firstOk && ex.fill ? ' <br>Your first cell works — the problem appears when the formula is copied down.' : ''));
  const f = res.sh.fmtOf(bad.addr);
  if (firstOk && ex.fill) return fb('think', 'Breaks when copied', `Row ${res.results[0].addr.replace(/\D/g, '')} is right, but <b>${bad.addr}</b> gives <code>${esc(display(bad.got, f))}</code> instead of <code>${esc(display(bad.exp, f))}</code>. Should something be locked with <code>$</code>?`);
  if (ex.check) return fb('think', 'Not quite', `<b>${bad.addr}</b> gave <code>${esc(display(bad.got, f))}</code>, which doesn't fit the task.`);
  return fb('think', 'Not quite', `<b>${bad.addr}</b> gives <code>${esc(display(bad.got, f))}</code>. Expected <code>${esc(display(bad.exp, f))}</code>.`);
}

    <p class="muted" style="margin:4px 0 0">French name, English name, syntax, example. Your exam is open-book — this is the kind of page to keep open.</p>
    <label for="q" class="muted" style="position:absolute;left:-9999px">Search a function</label>
    <input id="q" class="search" placeholder="Search: si, date, compte, lookup…" value="${esc(S.cheatQ || '')}">
    <div id="cheat-list">${cheatList(S.cheatQ || '')}</div>
  </div>`;
}
function cheatList(q){
  const k = stripAcc(q).toLowerCase().trim();
  const rows = CHEAT.filter(r => !k || stripAcc(r.join(' ')).toLowerCase().includes(k));
  if (!rows.length) return `<div class="empty">${cat('sad', 64)}<p>Nothing matches "${esc(q)}". Try the French or English name.</p></div>`;
  return TOPICS.map(t => { const g = rows.filter(r => r[0] === t.id); if (!g.length) return '';
    return `<h3>${t.name}</h3>` + g.map(([, fr, en, syn, does, exm]) => `<div class="card fn">
      <div class="top"><span class="name">${esc(fr)}</span><span class="muted">${esc(en)}</span></div>
      <div class="syn">${esc(syn)}</div><p>${esc(does)}</p>${exm ? `<p class="muted">Ex: <code>${esc(exm)}</code></p>` : ''}</div>`).join(''); }).join('');
}

// ---------- ACTIONS ----------
function start(tid){
  let list = tid === 'mix' ? EX.slice().sort(() => Math.random() - .5) : EX.filter(e => e.topic === tid);
  if (tid !== 'mix'){ const firstUnsolved = list.findIndex(e => !(P.ex[e.id] && P.ex[e.id].s)); if (firstUnsolved > 0) list = list.slice(firstUnsolved).concat(list.slice(0, firstUnsolved)); }
  S.queue = list.map(e => e.id); S.qi = 0; S.topic = tid; S.done = false; S.view = 'practice';
  resetExercise(); render();
}
function resetExercise(){
  S.result = null; S.showHint = false; S.showSol = false; S.picked = null; S.draft = '=';
  const ex = exById(S.queue[S.qi]);
  if (ex && ex.type === 'mcq') ex.order = ex.options.map((_, i) => i).sort(() => Math.random() - .5);
}
function record(id, ok){
  const r = P.ex[id] || (P.ex[id] = { s:false, a:0, first:false });
  if (r.s){ return; }
  r.a++;
  if (ok){ r.s = true; if (r.a === 1 && !S.showSol) r.first = true; P.streak++; P.best = Math.max(P.best, P.streak); }
  else P.streak = 0;
  saveProgress();
}
function check(){
  const input = document.getElementById('formula'); if (!input) return;
  S.draft = input.value;
  const ex = exById(S.queue[S.qi]);
  let f = S.draft.trim(); if (f && !f.startsWith('=')) f = '=' + f;
  try { S.result = runExercise(ex, f); }
  catch (e){ S.result = { parseError:'Something unexpected happened with this formula. Try writing it another way.' }; }
  record(ex.id, !!S.result.pass);
  render(); focusFormula();
}
function next(){ if (S.qi + 1 >= S.queue.length) S.done = true; else { S.qi++; resetExercise(); } render(); focusFormula(); }
function focusFormula(){ const i = document.getElementById('formula'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }

function render(){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', (b.dataset.go === S.view || (b.dataset.go === 'home' && S.view === 'practice')) ? 'page' : 'false'));
  const app = document.getElementById('app');
  app.innerHTML = S.view === 'practice' ? viewPractice() : S.view === 'progress' ? viewProgress() : S.view === 'cheat' ? viewCheat() : viewHome();
}

function init(){
  document.getElementById('logo').innerHTML = cat('happy', 44);
  document.addEventListener('click', e => {
    const t = e.target.closest('button, td[data-addr]'); if (!t) return;
    if (t.dataset.go){ S.view = t.dataset.go; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.start){ start(t.dataset.start); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-check')) return check();
    if (t.hasAttribute('data-next')) return next();
    if (t.hasAttribute('data-hint')){ S.draft = (document.getElementById('formula') || {}).value || S.draft; S.showHint = !S.showHint; render(); return focusFormula(); }
    if (t.hasAttribute('data-sol')){ S.draft = (document.getElementById('formula') || {}).value || S.draft; S.showSol = true; render(); return focusFormula(); }
    if (t.hasAttribute('data-reset')){ if (confirm('Erase all your progress? This can\'t be undone.')){ P = { ex:{}, streak:0, best:0 }; saveProgress(); render(); } return; }
    if (t.dataset.opt !== undefined){ const ex = exById(S.queue[S.qi]); S.picked = +t.dataset.opt; record(ex.id, S.picked === ex.answer); render(); const n = document.querySelector('[data-next]'); if (n) n.focus(); return; }
    if (t.dataset.addr){
      const input = document.getElementById('formula'); if (!input) return;
      if (!input.value.startsWith('=')) input.value = '=' + input.value;
      const s = input.selectionStart ?? input.value.length, en = input.selectionEnd ?? input.value.length;
      input.setRangeText(t.dataset.addr, Math.max(s, 1), Math.max(en, 1), 'end'); input.focus(); S.draft = input.value;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'formula'){ e.preventDefault(); if (S.result && S.result.pass) next(); else check(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'formula') S.draft = e.target.value;
    if (e.target.id === 'q'){ S.cheatQ = e.target.value; document.getElementById('cheat-list').innerHTML = cheatList(S.cheatQ); }
  });
  render();
}
if (typeof document !== 'undefined') init();
</script>
</body>
</html>
